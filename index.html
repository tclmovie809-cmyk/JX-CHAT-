<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JX CHAT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #05051a;
      color: white;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      position: relative;
      background:
        radial-gradient(circle at 10% 5%, #4b20d8, transparent 30%),
        radial-gradient(circle at 90% 90%, #3020c9, transparent 35%),
        linear-gradient(145deg, #08082b, #090018);
    }

    /* =========================
       SPLASH SCREEN
    ========================= */

    #splash {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 58px;
      font-weight: bold;
      background: linear-gradient(135deg, #d52cff, #613cff, #00cfff);
      box-shadow: 0 0 25px #8b35ff, 0 0 60px #4433ff;
      margin-bottom: 28px;
    }

    .name {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .name span {
      background: linear-gradient(90deg, #d52cff, #00cfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      margin-top: 12px;
      color: #c9c9e8;
      font-size: 15px;
      letter-spacing: 3px;
    }

    .start {
      position: absolute;
      bottom: 100px;
      width: 72%;
      padding: 17px;
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(90deg, #a719ff, #244cff, #00bfff);
      box-shadow: 0 0 25px #6c36ff;
    }

    /* =========================
       LOGIN + CREATE ACCOUNT
    ========================= */

    #login,
    #register {
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 35px;
    }

    .login-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      font-size: 35px;
      font-weight: bold;
      background: linear-gradient(135deg, #d52cff, #613cff, #00cfff);
      box-shadow: 0 0 30px #713cff;
    }

    .login-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #aaaac8;
      margin-bottom: 35px;
    }

    .input {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #37375f;
      border-radius: 14px;
      outline: none;
      background: #11112f;
      color: white;
      font-size: 16px;
    }

    .input::placeholder {
      color: #77779c;
    }

    .input:focus {
      border-color: #9a3cff;
      box-shadow: 0 0 10px #5d32ff;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #a719ff, #244cff, #00bfff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(111, 50, 255, 0.35);
    }

    .login-btn:active,
    .start:active {
      transform: scale(0.98);
    }

    .create {
      text-align: center;
      margin-top: 25px;
      color: #b9b9d8;
      font-size: 15px;
    }

    .create-link {
      background: none;
      border: none;
      padding: 0;
      margin-left: 4px;
      color: #b83cff;
      font-size: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .create-link:hover {
      text-decoration: underline;
    }

    .back {
      position: absolute;
      top: 25px;
      left: 25px;
      color: #aaaac8;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
    }

    .message {
      text-align: center;
      margin-top: 22px;
      color: #b9b9d8;
      font-size: 14px;
    }

    .message button {
      background: none;
      border: none;
      color: #b83cff;
      font-size: inherit;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      margin-left: 3px;
    }

    /* =========================
       CREATE ACCOUNT SCREEN
    ========================= */

    #register {
      padding-top: 25px;
    }

    #register .login-logo {
      width: 75px;
      height: 75px;
      font-size: 28px;
      margin-bottom: 18px;
    }

    #register .login-title {
      font-size: 30px;
    }

    #register .login-subtitle {
      margin-bottom: 22px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-height: 700px) {

      #register {
        justify-content: flex-start;
        padding-top: 70px;
      }

      #register .login-logo {
        margin-bottom: 12px;
      }

      #register .login-subtitle {
        margin-bottom: 15px;
      }

      .input {
        padding: 13px;
        margin-bottom: 10px;
      }

      .login-btn {
        padding: 14px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       SPLASH SCREEN
  ========================= -->

  <div id="splash" class="screen">

    <div class="logo">JX</div>

    <div class="name">
      <span>JX</span> CHAT
    </div>

    <div class="tagline">
      Connect. Chat. Share.
    </div>

    <button class="start" onclick="openLogin()">
      START →
    </button>

  </div>


  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <div id="login" class="screen">

    <div class="back" onclick="goBack()">
      ← Back
    </div>

    <div class="login-logo">
      JX
    </div>

    <h1 class="login-title">
      Welcome to JX CHAT
    </h1>

    <p class="login-subtitle">
      Login to continue chatting
    </p>

    <input
      id="loginUsername"
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login-btn" onclick="login()">
      LOGIN
    </button>

    <div class="create">
      Don't have an account?

      <button
        class="create-link"
        type="button"
        onclick="openCreateAccount()"
      >
        Create Account
      </button>
    </div>

  </div>


  <!-- =========================
       CREATE ACCOUNT SCREEN
  ========================= -->

  <div id="register" class="screen">

    <div class="back" onclick="backToLogin()">
      ← Back
    </div>

    <div class="login-logo">
      JX
    </div>

    <h1 class="login-title">
      Create Account
    </h1>

    <p class="login-subtitle">
      Join JX CHAT today
    </p>

    <input
      id="registerUsername"
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="registerEmail"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="registerPassword"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <input
      id="registerConfirm"
      class="input"
      type="password"
      placeholder="Confirm Password"
      autocomplete="new-password"
    >

    <button
      class="login-btn"
      type="button"
      onclick="createAccount()"
    >
      CREATE ACCOUNT
    </button>

    <div class="message">
      Already have an account?

      <button
        type="button"
        onclick="backToLogin()"
      >
        Login
      </button>
    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       SPLASH → LOGIN
    ========================= */

    function openLogin() {

      document.getElementById("splash").style.display = "none";
      document.getElementById("register").style.display = "none";
      document.getElementById("login").style.display = "flex";

    }


    /* =========================
       LOGIN → SPLASH
    ========================= */

    function goBack() {

      document.getElementById("login").style.display = "none";
      document.getElementById("register").style.display = "none";
      document.getElementById("splash").style.display = "flex";

    }


    /* =========================
       LOGIN → CREATE ACCOUNT
    ========================= */

    function openCreateAccount() {

      document.getElementById("splash").style.display = "none";
      document.getElementById("login").style.display = "none";
      document.getElementById("register").style.display = "flex";

      window.scrollTo(0, 0);

    }


    /* =========================
       CREATE ACCOUNT → LOGIN
    ========================= */

    function backToLogin() {

      document.getElementById("register").style.display = "none";
      document.getElementById("login").style.display = "flex";

    }


    /* =========================
       LOGIN
    ========================= */

    function login() {

      const username =
        document.getElementById("loginUsername").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      if (username === "" || password === "") {

        alert("Please enter your username and password.");

        return;
      }

      alert("JX CHAT LOGIN 💜💙");

    }


    /* =========================
       CREATE ACCOUNT
    ========================= */

    function createAccount() {

      const username =
        document.getElementById("registerUsername").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;

      const confirmPassword =
        document.getElementById("registerConfirm").value;


      /* EMPTY FIELDS */

      if (
        username === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
      ) {

        alert("Please fill in all fields.");

        return;
      }


      /* EMAIL CHECK */

      if (!email.includes("@")) {

        alert("Please enter a valid email address.");

        return;
      }


      /* PASSWORD MATCH */

      if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
      }


      /* PASSWORD LENGTH */

      if (password.length < 6) {

        alert("Password must be at least 6 characters.");

        return;
      }


      /* TEMPORARY SUCCESS */

      alert(
        "Account form completed! 💜💙\n\n" +
        "Username: " + username +
        "\nEmail: " + email +
        "\n\nThis is still a prototype.\n" +
        "Real account saving will be connected next."
      );

    }

  </script>

</body>
</html>
